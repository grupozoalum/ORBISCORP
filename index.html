/* ═══════════════════════════════════════════════════

/* ═══════════════════════════════════════════════════
   ORBISCORP SPA — UNIFIED STYLESHEET v2.1
   ★ 7-Point Mobile-First Optimization Layer
═══════════════════════════════════════════════════ */
:root {
  --orbis:        #2F3BA2; --orbis-dark:   #212B82; --orbis-deep:   #151E6B;
  --orbis-light:  #E8EBFA; --orbis-mid:    #6B78C8;
  --safety:       #F59E0B; --safety-dark:  #D97706; --safety-light: #FEF3C7;
  --success:      #10B981; --danger:       #EF4444;
  --bg:           #F0F3FA; --surface:      #FFFFFF; --surface2:     #F7F9FC;
  --border:       #DDE3F0; --text:         #1A1F3C; --text-2:       #4A5178; --text-3:       #8892B0;
  --font-body:    'DM Sans', sans-serif;
  --font-display: 'Syne', sans-serif;
  --font-mono:    'Fira Code', monospace;
  --r-sm: 6px; --r: 10px; --r-lg: 16px; --r-xl: 24px;
  --shadow-sm: 0 1px 3px rgba(47,59,162,.06), 0 1px 2px rgba(47,59,162,.04);
  --shadow:    0 4px 16px rgba(47,59,162,.10), 0 2px 6px rgba(47,59,162,.06);
  --shadow-lg: 0 12px 40px rgba(47,59,162,.14), 0 4px 12px rgba(47,59,162,.08);
  --shadow-xl: 0 24px 80px rgba(47,59,162,.18), 0 8px 24px rgba(47,59,162,.10);
  --nav-h:        68px; --toolbar-h: 0px;
  --mobile-nav-h: 64px; --safe-bottom: env(safe-area-inset-bottom, 0px);
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-elegant: cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; overflow-x: clip; -webkit-overflow-scrolling: touch; }
body {
  font-family: var(--font-body); background: var(--bg); color: var(--text);
  overflow-x: clip; min-height: 100vh; -webkit-font-smoothing: antialiased;
  padding-top: var(--toolbar-h); transition: padding-top .25s ease;
}
img { max-width: 100%; height: auto; display: block; }
a { text-decoration: none; color: inherit; }
button { font-family: var(--font-body); }
* { -webkit-tap-highlight-color: transparent; }
::selection { background: var(--orbis); color: #fff; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--orbis-mid), var(--orbis)); border-radius: 3px; }

/* ── LOADER ── */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--orbis-deep);
  background-image: radial-gradient(ellipse at 30% 20%, rgba(47,59,162,.6) 0%, transparent 60%),
                    radial-gradient(ellipse at 70% 80%, rgba(245,158,11,.1) 0%, transparent 50%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  transition: opacity .5s, visibility .5s;
}
#loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-logo {
  font-family: var(--font-display); font-size: clamp(2rem,8vw,2.8rem); letter-spacing: .12em;
  background: linear-gradient(135deg,#fff 0%,rgba(255,255,255,.8) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: loaderTextIn .6s var(--ease-spring) forwards;
}
.loader-logo span { background: linear-gradient(135deg,var(--safety) 0%,var(--safety-dark) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
@keyframes loaderTextIn { from{opacity:0;transform:translateY(12px) scale(.95);}to{opacity:1;transform:none;} }
.loader-sub { font-family: var(--font-mono); font-size:.65rem; letter-spacing:.3em; color:rgba(255,255,255,.3); text-transform:uppercase; animation:fadeUp .8s .3s ease forwards; opacity:0; }
@keyframes fadeUp { to{opacity:1;} }
.loader-bar { width:min(200px,60vw); height:2px; background:rgba(255,255,255,.08); border-radius:1px; overflow:hidden; }
.loader-fill { height:100%; background:linear-gradient(90deg,var(--safety) 0%,#fff 50%,var(--safety) 100%); background-size:200% 100%; animation:loaderFill 1.4s var(--ease-smooth) forwards, loaderShine 1.4s linear infinite; }
@keyframes loaderFill { from{width:0}to{width:100%} }
@keyframes loaderShine { 0%{background-position:200% 0;}100%{background-position:-200% 0;} }

/* ── ADMIN TOOLBAR ── */
#admin-toolbar {
  display:none; position:fixed; top:0; left:0; right:0; z-index:300; height:44px;
  background:linear-gradient(90deg,var(--orbis-deep) 0%,#0d1555 100%);
  border-bottom:2px solid var(--safety);
  align-items:center; justify-content:space-between; padding:0 16px; gap:8px; overflow-x:auto;
}
#admin-toolbar.active { display:flex; }
.dock-id { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.dock-pulse { width:7px; height:7px; background:var(--safety); border-radius:50%; animation:pulse 2s infinite; flex-shrink:0; }
.dock-label { font-family:var(--font-mono); font-size:10px; letter-spacing:.15em; color:var(--safety); text-transform:uppercase; white-space:nowrap; }
#save-status-wrap { display:flex; align-items:center; gap:4px; padding:2px 7px; border:1px solid rgba(255,255,255,.1); border-radius:3px; flex-shrink:0; }
.save-dot { width:5px; height:5px; border-radius:50%; background:var(--text-3); transition:background .3s; flex-shrink:0; }
#save-status-wrap.saving { border-color:var(--safety); } #save-status-wrap.saving .save-dot { background:var(--safety); animation:pulse 1s infinite; }
#save-status-wrap.saved  { border-color:var(--success); } #save-status-wrap.saved  .save-dot { background:var(--success); }
#save-status-wrap.error  { border-color:var(--danger);  } #save-status-wrap.error  .save-dot { background:var(--danger);  }
#save-txt { font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; color:rgba(255,255,255,.4); white-space:nowrap; }
.dock-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.dock-btn { font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; background:transparent; color:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.15); padding:5px 10px; cursor:pointer; border-radius:3px; transition:all .15s; min-height:28px; white-space:nowrap; }
.dock-btn:hover { border-color:var(--safety); color:var(--safety); }
.dock-btn.primary { background:var(--safety); border-color:var(--safety); color:var(--text); font-weight:600; }
.dock-btn.primary:hover { background:var(--safety-dark); }
.dock-btn.danger:hover { border-color:var(--danger); color:var(--danger); }

/* ── NAV ── */
nav#main-nav {
  position:sticky; top:var(--toolbar-h); z-index:200; height:var(--nav-h);
  background:rgba(255,255,255,.92); backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(221,227,240,.6); transition:all .4s var(--ease-elegant);
}
nav#main-nav.scrolled { background:rgba(255,255,255,.98); box-shadow:0 4px 24px rgba(47,59,162,.08),0 1px 4px rgba(47,59,162,.05); border-bottom-color:var(--border); }
.nav-inner { max-width:1280px; margin:0 auto; height:100%; display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:12px; }
.nav-logo { display:flex; align-items:center; gap:10px; flex-shrink:0; cursor:pointer; }
.nav-logo-mark { width:36px; height:36px; display:flex; align-items:center; justify-content:center; overflow:hidden; transition:transform .3s var(--ease-spring); flex-shrink:0; }
.nav-logo-mark img { width:100%; height:100%; object-fit:contain; }
.nav-logo:hover .nav-logo-mark { transform:scale(1.08) rotate(-2deg); }
.nav-logo-name { font-family:var(--font-display); font-size:clamp(1.1rem,3vw,1.3rem); letter-spacing:.08em; background:linear-gradient(135deg,var(--orbis) 0%,var(--orbis-dark) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; white-space:nowrap; }
.nav-logo-name span { background:linear-gradient(135deg,var(--safety) 0%,var(--safety-dark) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.nav-links { display:flex; align-items:center; gap:4px; list-style:none; }
.nav-links a { position:relative; font-size:.875rem; font-weight:600; color:var(--text-2); padding:8px 18px; border-radius:100px; transition:all .2s var(--ease-elegant); letter-spacing:.01em; white-space:nowrap; cursor:pointer; }
.nav-links a::after { display:none; }
.nav-links a:hover, .nav-links a.active { color:var(--orbis); background:rgba(47,59,162,0.06); box-shadow:none; transform:translateY(-1px); }
.nav-right { display:flex; align-items:center; gap:8px; }
.btn-cart { position:relative; background:rgba(47,59,162,0.08); border:none; color:var(--orbis); border-radius:100px; padding:8px 18px; font-size:.875rem; font-weight:700; cursor:pointer; transition:all .25s var(--ease-spring); display:flex; align-items:center; gap:8px; min-height:40px; overflow:hidden; white-space:nowrap; }
.btn-cart::before { content:''; position:absolute; inset:0; background:var(--orbis); transform:scaleX(0); transform-origin:left; transition:transform .3s var(--ease-smooth); z-index:0; border-radius:100px; }
.btn-cart:hover::before { transform:scaleX(1); }
.btn-cart:hover { color:#fff; border-color:var(--orbis); box-shadow:0 4px 16px rgba(47,59,162,.3); }
.btn-cart > * { position:relative; z-index:1; }
.cart-badge { position:absolute; top:-6px; right:-6px; background:var(--safety); color:var(--text); border-radius:50%; width:20px; height:20px; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--surface); }
.nav-cta { background:linear-gradient(135deg,var(--orbis) 0%,var(--orbis-dark) 100%); color:#fff; border:none; padding:9px 20px; border-radius:var(--r); font-size:.875rem; font-weight:600; cursor:pointer; transition:all .25s var(--ease-spring); min-height:40px; display:inline-flex; align-items:center; letter-spacing:.01em; box-shadow:0 2px 8px rgba(47,59,162,.3); white-space:nowrap; }
.nav-cta:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(47,59,162,.4); }
#nav-admin-badge { font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; color:var(--safety-dark); background:var(--safety-light); border:1px solid var(--safety); border-radius:3px; padding:3px 8px; display:none; }
.hamburger { display:none; flex-direction:column; gap:5px; width:40px; height:40px; align-items:center; justify-content:center; background:transparent; border:1px solid var(--border); border-radius:var(--r-sm); cursor:pointer; transition:all .2s; }
.hamburger span { display:block; width:18px; height:1.5px; background:var(--text); transition:all .25s; }
.hamburger.open span:nth-child(1) { transform:rotate(45deg) translate(4px,4px); }
.hamburger.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
.hamburger.open span:nth-child(3) { transform:rotate(-45deg) translate(4px,-4px); }

/* ── CHANGE #5: Drawer — card-based mobile-native layout ── */
#mobile-drawer {
  display:none; position:fixed; top:var(--nav-h); left:0; right:0; bottom:0; z-index:199;
  background: var(--bg);                    /* ★ was #fff */
  padding: 14px 12px;                       /* ★ tighter, card-friendly padding */
  flex-direction:column; gap:8px;           /* ★ gap between cards */
  border-top:1px solid var(--border); overflow-y:auto;
}
#mobile-drawer.open { display:flex; }
/* ★ Each link rendered as an independent card */
#mobile-drawer a {
  font-size: .975rem; font-weight: 500; color: var(--text-2);
  padding: 14px 18px;
  border-bottom: none;                      /* ★ removed hard separator */
  border-radius: var(--r-lg);              /* ★ card corners */
  background: var(--surface);              /* ★ white card face */
  box-shadow: 0 2px 8px rgba(47,59,162,.06), 0 1px 2px rgba(0,0,0,.04); /* ★ subtle lift */
  transition: all .2s var(--ease-elegant); cursor: pointer;
  display: flex; align-items: center; gap: 12px;
}
/* ★ Native-style chevron arrow indicator */
#mobile-drawer a::after {
  content: '›';
  font-size: 1.35rem; font-weight: 300;
  color: var(--text-3);
  margin-left: auto; flex-shrink: 0;
  transition: transform .2s var(--ease-spring), color .2s;
}
#mobile-drawer a:hover, #mobile-drawer a.active {
  color: var(--orbis);
  background: var(--orbis-light);
  box-shadow: 0 4px 16px rgba(47,59,162,.1);
}
#mobile-drawer a:hover::after, #mobile-drawer a.active::after {
  transform: translateX(4px);
  color: var(--orbis-mid);
}

/* ── VIEWS ── */
.view { display:none; }
.view.active { display:block; animation:viewIn .4s var(--ease-smooth); }
@keyframes viewIn { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;} }

/* ── HERO ── */
#hero, #cat-hero {
  position:relative; overflow:hidden;
  background:linear-gradient(135deg,var(--orbis-deep) 0%,var(--orbis) 60%,var(--orbis-mid) 100%);
  min-height:88vh; display:flex; align-items:center;
}
.hero-pattern { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.hero-pattern::before { content:''; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px); background-size:50px 50px; }
.hero-floating-orb { position:absolute; border-radius:50%; filter:blur(80px); pointer-events:none; animation:orbFloat 8s ease-in-out infinite; }
.hero-floating-orb-1 { width:clamp(200px,40vw,380px); height:clamp(200px,40vw,380px); background:rgba(107,120,200,.25); top:-10%; right:-5%; animation-delay:-2s; }
.hero-floating-orb-2 { width:clamp(120px,25vw,240px); height:clamp(120px,25vw,240px); background:rgba(245,158,11,.12); bottom:10%; left:5%; animation-delay:-5s; }
@keyframes orbFloat { 0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-20px) scale(1.05);} }
.hero-diag { position:absolute; bottom:0; left:0; right:0; height:80px; background:var(--bg); clip-path:polygon(0 100%,100% 0,100% 100%); }
.hero-inner { max-width:1280px; margin:0 auto; padding:10px 24px 40px; position:relative; z-index:1; width:100%; }
.hero-badge { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:100px; padding:6px 14px; font-size:.8rem; font-weight:500; margin-bottom:28px; }
.hero-badge-dot { width:8px; height:8px; background:var(--safety); border-radius:50%; animation:pulse 2s infinite; flex-shrink:0; }
.hero-title { font-family:var(--font-display); font-size:clamp(2.4rem,6vw,4rem); color:#fff; line-height:1.1; margin-bottom:20px; letter-spacing:-.01em; }
.hero-title em { font-style:normal; background:linear-gradient(135deg,var(--safety) 0%,#FFD47E 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.hero-desc { font-size:clamp(1rem,2vw,1.15rem); color:rgba(255,255,255,.75); max-width:560px; line-height:1.75; margin-bottom:36px; font-weight:300; }
.hero-actions { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:28px; }
.btn-hero-primary { background:linear-gradient(135deg,var(--safety) 0%,var(--safety-dark) 100%); color:var(--text); border:none; padding:15px 30px; border-radius:var(--r-lg); font-size:1rem; font-weight:700; cursor:pointer; transition:all .3s var(--ease-spring); box-shadow:0 6px 24px rgba(245,158,11,.4); display:inline-flex; align-items:center; gap:8px; }
.btn-hero-primary:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 12px 36px rgba(245,158,11,.55); }
.btn-hero-secondary { background:rgba(255,255,255,.1); color:#fff; border:1.5px solid rgba(255,255,255,.3); padding:15px 28px; border-radius:var(--r-lg); font-size:1rem; font-weight:600; cursor:pointer; transition:all .3s var(--ease-spring); display:inline-flex; align-items:center; gap:8px; }
.btn-hero-secondary:hover { background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.5); transform:translateY(-2px); }
.hero-stats { display:flex; gap:40px; }
.hero-stat { display:flex; flex-direction:column; gap:4px; }
.hero-stat-num { font-family:var(--font-display); font-size:clamp(1.5rem,3.5vw,2.2rem); color:#fff; line-height:1; }
.hero-stat-label { font-family:var(--font-mono); font-size:.65rem; letter-spacing:.15em; color:rgba(255,255,255,.45); text-transform:uppercase; }

/* ── TRUST BAR ── */

/* ── BREADCRUMB ── */

.breadcrumb-inner { max-width:1280px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:8px; font-size:.85rem; }

.section { padding:80px 24px; }
.section-inner { max-width:1280px; margin:0 auto; }
.catalog-bg { background:var(--bg); }

/* ── SHOWROOM ── */
.showroom-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
@media(max-width:1100px){.showroom-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.showroom-grid{grid-template-columns:1fr;gap:16px;}}

/* ── CHANGE #7: Showcase card — zero borders, cinematic shadow ── */
.showcase-card {
  background: var(--surface);
  border: none;                                                                         /* ★ removed border */
  box-shadow: 0 4px 16px rgba(0,0,0,.04), 0 1px 4px rgba(47,59,162,.04);             /* ★ subtle lift */
  border-radius: var(--r-xl); overflow:hidden; cursor:pointer;
  transition: all .3s var(--ease-spring); display:block; color:inherit; position:relative;
}
.showcase-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 48px rgba(47,59,162,.13), 0 6px 16px rgba(0,0,0,.07);           /* ★ cinematic hover */
}
.sc-cat-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; border-bottom:1px solid var(--border); }
.sc-cat-left { display:flex; align-items:center; gap:10px; }
.sc-cat-icon { font-size:1.4rem; }
.sc-cat-name { font-family:var(--font-mono); font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; color:var(--orbis); font-weight:600; }
.sc-cat-arrow { color:var(--orbis-mid); font-size:1.1rem; transition:transform .2s; }
.showcase-card:hover .sc-cat-arrow { transform:translateX(4px); }
.sc-img-wrap { position:relative; aspect-ratio:16/10; background:var(--orbis-light); overflow:hidden; }
.sc-img-wrap img { width:100%; height:100%; object-fit:cover; transition:transform .6s var(--ease-elegant); }
.showcase-card:hover .sc-img-wrap img { transform: none; }
.sc-img-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(21,30,107,.7) 0%,transparent 50%); display:flex; align-items:flex-end; padding:16px; opacity:0; transition:opacity .3s; }
.showcase-card:hover .sc-img-overlay { opacity:1; }
.sc-img-badge { font-family:var(--font-mono); font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:var(--safety); background:rgba(21,30,107,.6); border:1px solid rgba(245,158,11,.3); border-radius:4px; padding:5px 10px; }
.sc-img-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:4rem; opacity:.25; }
.sc-body { padding:16px 20px 20px; }
.sc-sku { font-family:var(--font-mono); font-size:.62rem; letter-spacing:.12em; color:var(--text-3); text-transform:uppercase; margin-bottom:6px; }
.sc-name { font-family:var(--font-display); font-size:1.05rem; color:var(--text); margin-bottom:6px; line-height:1.3; }
.sc-desc { font-size:.82rem; color:var(--text-2); line-height:1.6; margin-bottom:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.sc-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sc-price { font-family:var(--font-display); font-size:1.25rem; color:var(--orbis); }
.sc-price span { font-family:var(--font-body); font-size:.75rem; color:var(--text-3); font-weight:400; }
.sc-cta { background:linear-gradient(135deg,var(--orbis) 0%,var(--orbis-dark) 100%); color:#fff; border:none; border-radius:var(--r); padding:9px 16px; font-size:.8rem; font-weight:700; cursor:pointer; transition:all .2s; white-space:nowrap; min-height:38px; }
.sc-cta:hover { transform:scale(1.04); box-shadow:0 6px 20px rgba(47,59,162,.4); }
.sc-admin-bar { display:none; position:absolute; bottom:0; left:0; right:0; background:rgba(21,30,107,.92); padding:10px 16px; flex-direction:row; gap:8px; align-items:center; justify-content:flex-end; }
body.admin-mode .showcase-card:hover .sc-admin-bar { display:flex; }

/* ── CATEGORÍAS SHOWCASE ── */
.categorias-showcase { display:flex; flex-direction:column; gap:24px; }
.cat-gallery-block { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-xl); overflow:hidden; }
.cat-gallery-header { display:flex; align-items:center; justify-content:space-between; padding:18px 24px; background:linear-gradient(135deg,var(--orbis-deep) 0%,var(--orbis) 100%); cursor:pointer; user-select:none; }
.cat-gallery-header-left { display:flex; align-items:center; gap:12px; }
.cat-gallery-title { font-family:var(--font-display); font-size:1.1rem; color:#fff; letter-spacing:.02em; }
.cat-gallery-count { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.1em; color:rgba(255,255,255,.5); background:rgba(255,255,255,.1); border-radius:100px; padding:3px 10px; }
.cat-expand-hint { display:flex; align-items:center; gap:8px; }
.cat-expand-hint-text { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.08em; color:rgba(255,255,255,.4); display:none; }
.cat-gallery-block.expanded .cat-expand-hint-text { display:block; }
.cat-expand-arrow { color:var(--safety); font-size:.85rem; transition:transform .3s; }
.cat-gallery-block.expanded .cat-expand-arrow { transform:rotate(180deg); }
.cat-cover-body { display:grid; grid-template-columns:240px 1fr; gap:0; min-height:220px; }
@media(max-width:680px){.cat-cover-body{grid-template-columns:1fr;}}
.cat-product-img-wrap { position:relative; background:var(--orbis-light); overflow:hidden; }
.cat-product-img-wrap img { width:100%; height:100%; object-fit:cover; transition:transform .6s var(--ease-elegant); }
.cat-gallery-block:hover .cat-product-img-wrap img { transform:scale(1.05); }
.img-placeholder { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:4rem; opacity:.2; min-height:160px; }
.cat-cover-info { padding:24px; display:flex; flex-direction:column; justify-content:space-between; gap:16px; }
.cat-product-sku { font-family:var(--font-mono); font-size:.62rem; letter-spacing:.14em; color:var(--orbis-mid); text-transform:uppercase; margin-bottom:4px; }
.cat-product-name { font-family:var(--font-display); font-size:1.3rem; color:var(--text); margin-bottom:8px; line-height:1.25; }
.cat-product-desc { font-size:.875rem; color:var(--text-2); line-height:1.7; font-weight:300; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.cat-product-price { font-family:var(--font-display); font-size:1.8rem; background:linear-gradient(135deg,var(--orbis) 0%,var(--orbis-dark) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.cat-product-price span { font-family:var(--font-body); font-size:.8rem; color:var(--text-3); font-weight:400; -webkit-text-fill-color:var(--text-3); }
.cat-product-stock { font-family:var(--font-mono); font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--success); padding:3px 10px; background:#D1FAE5; border-radius:100px; display:inline-block; margin-bottom:12px; }
.cat-product-stock.low { color:var(--safety-dark); background:#FEF3C7; }
.cat-product-stock.out { color:var(--danger); background:#FEE2E2; }
.cat-cover-cta { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.btn-cover-explore { background:linear-gradient(135deg,var(--orbis) 0%,var(--orbis-dark) 100%); color:#fff; border:none; border-radius:var(--r); padding:10px 20px; font-size:.875rem; font-weight:700; cursor:pointer; transition:all .25s var(--ease-spring); display:inline-flex; align-items:center; gap:8px; min-height:42px; }
.btn-cover-explore:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(47,59,162,.4); }
.cat-cover-meta { font-family:var(--font-mono); font-size:.65rem; letter-spacing:.1em; color:var(--text-3); }
.cat-product-admin-bar { display:none; flex-direction:row; gap:8px; margin-top:8px; }
body.admin-mode .cat-product-admin-bar { display:flex; }
.cat-grid-panel { max-height:0; overflow:hidden; transition:max-height .5s var(--ease-smooth); border-top:0px solid var(--border); }
.cat-gallery-block.expanded .cat-grid-panel { max-height:4000px; border-top-width:1px; }
.cat-grid-inner { padding:24px; }
.cat-grid-title { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:var(--orbis-mid); margin-bottom:16px; }
.cat-products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
.cat-empty-state { display:flex; align-items:center; gap:16px; padding:32px 24px; }
.cat-empty-icon { font-size:3rem; }
.cat-empty-text { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:var(--text-3); }

/* ── CHANGE #7: Product cards — zero borders, cinematic shadow ── */
.prod-card {
  background: var(--surface);
  border: none;                                                                         /* ★ removed border */
  box-shadow: 0 4px 16px rgba(0,0,0,.04), 0 1px 4px rgba(47,59,162,.04);             /* ★ subtle resting shadow */
  border-radius: var(--r-lg); overflow:hidden;
  transition: all .3s var(--ease-spring); position:relative;
}
.prod-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(47,59,162,.12), 0 4px 12px rgba(0,0,0,.06);           /* ★ cinematic hover depth */
}
.prod-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--orbis) 0%,var(--orbis-mid) 100%); transform:scaleX(0); transform-origin:left; transition:transform .4s var(--ease-smooth); z-index:10; }
.prod-card:hover::before { transform:scaleX(1); }
.prod-card-img { position:relative; aspect-ratio:4/3; background:linear-gradient(135deg,var(--orbis-light) 0%,#e2e8f8 100%); overflow:hidden; }
.prod-card-img img { width:100%; height:100%; object-fit:cover; transition:transform .6s var(--ease-elegant); }
.prod-card:hover .prod-card-img img { 
  transform: none !important; /* Desactiva el zoom */
}
.prod-card-body { padding:16px; }
.prod-card-sku { font-family:var(--font-mono); font-size:.62rem; letter-spacing:.14em; color:var(--orbis-mid); text-transform:uppercase; margin-bottom:4px; }
.prod-card-name { font-size:.95rem; font-weight:600; color:var(--text); margin-bottom:6px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.prod-card-desc { font-size:.8rem; color:var(--text-2); line-height:1.6; margin-bottom:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.prod-card-price { font-family:var(--font-display); font-size:1.35rem; background:linear-gradient(135deg,var(--orbis) 0%,var(--orbis-dark) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:8px; }
.prod-card-price span { font-family:var(--font-body); font-size:.75rem; color:var(--text-3); -webkit-text-fill-color:var(--text-3); }
.prod-card-stock { font-family:var(--font-mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:var(--success); padding:3px 8px; background:#D1FAE5; border-radius:100px; display:inline-block; margin-bottom:10px; }
.prod-card-stock.low { color:var(--safety-dark); background:#FEF3C7; }
.prod-card-stock.out { color:var(--danger); background:#FEE2E2; }
.btn-add-card { width:100%; background:linear-gradient(135deg,var(--orbis) 0%,var(--orbis-dark) 100%); color:#fff; font-weight:700; font-size:.78rem; border:none; border-radius:var(--r); padding:9px 14px; cursor:pointer; transition:all .25s var(--ease-spring); display:flex; align-items:center; justify-content:center; gap:5px; min-height:40px; box-shadow:0 2px 8px rgba(47,59,162,.3); }
.btn-add-card:hover:not(:disabled) { transform:scale(1.04); box-shadow:0 6px 20px rgba(47,59,162,.4); }
.btn-add-card.added { background:linear-gradient(135deg,var(--success) 0%,#059669 100%); }
.btn-add-card:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
.prod-card-admin-bar { display:none; flex-direction:row; gap:6px; margin-top:8px; }
body.admin-mode .prod-card-admin-bar { display:flex; }
.padmin-btn { font-family:var(--font-mono); font-size:.65rem; letter-spacing:.08em; background:var(--orbis-light); border:1px solid var(--border); color:var(--orbis); border-radius:4px; padding:5px 10px; cursor:pointer; transition:all .15s; flex:1; min-height:30px; }
.padmin-btn:hover { background:var(--orbis); color:#fff; border-color:var(--orbis); }
.padmin-btn.danger:hover { background:var(--danger); color:#fff; border-color:var(--danger); }
.admin-img-trigger { position:absolute; inset:0; background:rgba(21,30,107,.0); transition:background .2s; cursor:default; display:flex; align-items:center; justify-content:center; }
body.admin-mode .admin-img-trigger { cursor:pointer; }
body.admin-mode .admin-img-trigger:hover { background:rgba(21,30,107,.5); }
.admin-img-trigger-label { font-family:var(--font-mono); font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:#fff; background:rgba(21,30,107,.7); border:1px solid rgba(255,255,255,.2); border-radius:4px; padding:6px 12px; opacity:0; transition:opacity .2s; pointer-events:none; }
body.admin-mode .admin-img-trigger:hover .admin-img-trigger-label { opacity:1; }
.admin-img-input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; display:none; }
body.admin-mode .admin-img-input { display:block; }

/* ── CONTACT ── */
.contact-bg { background:linear-gradient(135deg,var(--orbis-deep) 0%,var(--orbis) 100%); position:relative; overflow:hidden; }
.contact-bg::before { content:''; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px); background-size:56px 56px; pointer-events:none; }
.contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:48px; max-width:1280px; margin:0 auto; padding:80px 24px; }
@media(max-width:1024px){.contact-grid{grid-template-columns:1fr;gap:40px;}}
.contact-info-title { font-family:var(--font-display); font-size:clamp(1.6rem,3vw,2.2rem); color:#fff; margin-bottom:14px; }
.contact-info-desc { font-size:1rem; color:rgba(255,255,255,.6); line-height:1.75; max-width:440px; font-weight:300; margin-bottom:28px; }
.contact-data { display:flex; flex-direction:column; gap:12px; }
.cdata-item { display:flex; align-items:center; gap:14px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); border-radius:var(--r); padding:14px 16px; transition:all .25s; backdrop-filter:blur(8px); }
.cdata-item:hover { background:rgba(255,255,255,.11); border-color:rgba(255,255,255,.18); transform:translateX(4px); }
.cdata-icon { font-size:1.3rem; flex-shrink:0; }
.cdata-label { font-family:var(--font-mono); font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:3px; }
.cdata-val { font-size:.9rem; color:rgba(255,255,255,.8); font-weight:300; }
.cdata-val a { color:rgba(255,255,255,.8); transition:color .15s; }
.cdata-val a:hover { color:var(--safety); }
.contact-form { background:var(--surface); border-radius:var(--r-xl); overflow:hidden; box-shadow:var(--shadow-xl),0 0 0 1px rgba(255,255,255,.08); position:relative; z-index:1; }
.form-head { background:linear-gradient(135deg,var(--orbis-deep) 0%,var(--orbis) 100%); padding:20px 24px; border-bottom:2px solid var(--safety); }
.form-head h3 { font-family:var(--font-mono); font-size:.8rem; letter-spacing:.15em; text-transform:uppercase; color:var(--safety); margin-bottom:2px; }
.form-head p  { font-size:.8rem; color:rgba(255,255,255,.4); font-family:var(--font-mono); letter-spacing:.08em; }
.form-body { padding:24px; display:flex; flex-direction:column; gap:14px; }
.fgrp { display:flex; flex-direction:column; gap:5px; }
.fgrp label { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); }
.fgrp input, .fgrp select, .fgrp textarea { background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:var(--font-body); font-size:.9rem; padding:12px 14px; border-radius:var(--r); outline:none; transition:border-color .25s,box-shadow .25s,background .25s; width:100%; min-height:48px; }
.fgrp input:focus, .fgrp select:focus, .fgrp textarea:focus { border-color:var(--orbis); background:#fff; box-shadow:0 0 0 4px rgba(47,59,162,.08); }
.fgrp textarea { min-height:100px; resize:vertical; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-err { font-family:var(--font-mono); font-size:.75rem; color:var(--danger); letter-spacing:.08em; display:none; }
.form-err.show { display:block; }
.btn-submit { background:linear-gradient(135deg,var(--orbis) 0%,var(--orbis-dark) 100%); color:#fff; font-weight:700; font-size:.95rem; border:none; border-radius:var(--r); padding:14px; cursor:pointer; transition:all .3s var(--ease-spring); width:100%; min-height:52px; display:flex; align-items:center; justify-content:center; gap:8px; letter-spacing:.01em; box-shadow:0 4px 16px rgba(47,59,162,.3); }
.btn-submit:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(47,59,162,.42); }
.btn-submit:disabled { opacity:.6; cursor:not-allowed; transform:none; }
.form-success { display:none; text-align:center; padding:36px 28px; }
.form-success.show { display:block; }
.success-icon { font-size:3rem; margin-bottom:12px; }
.success-title { font-family:var(--font-display); font-size:1.5rem; color:var(--orbis); margin-bottom:8px; }
.success-text { font-size:.9rem; color:var(--text-2); line-height:1.7; }

/* ── FOOTER ── */
footer { background:linear-gradient(180deg,var(--orbis-deep) 0%,#0d1555 100%); border-top:2px solid var(--safety); padding:56px 20px 40px; position:relative; overflow:hidden; }
footer::before { content:''; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(ellipse at 10% 50%,rgba(47,59,162,.3) 0%,transparent 50%),radial-gradient(ellipse at 90% 50%,rgba(245,158,11,.04) 0%,transparent 40%); }
.footer-inner { max-width:1280px; margin:0 auto; position:relative; z-index:1; }
.footer-grid { display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:40px; margin-bottom:40px; }
@media(max-width:1100px){.footer-grid{grid-template-columns:1fr 1fr;gap:32px;}}
.footer-brand { font-family:var(--font-display); font-size:1.5rem; background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.85) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:8px; letter-spacing:.06em; }
.footer-brand span { background:linear-gradient(135deg,var(--safety) 0%,var(--safety-dark) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.footer-tagline { font-size:.85rem; color:rgba(255,255,255,.45); line-height:1.65; max-width:220px; font-weight:300; }
.footer-col-label { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.3); margin-bottom:16px; }
.footer-links { list-style:none; display:flex; flex-direction:column; gap:8px; }
.footer-links a { font-size:.875rem; color:rgba(255,255,255,.45); transition:all .2s; font-weight:300; display:flex; align-items:center; gap:6px; cursor:pointer; }
.footer-links a::before { content:'→'; font-size:.65rem; opacity:0; transform:translateX(-4px); transition:all .2s; }
.footer-links a:hover { color:var(--safety); padding-left:4px; }
.footer-links a:hover::before { opacity:1; transform:translateX(0); }
.footer-bottom { border-top:1px solid rgba(255,255,255,.07); padding-top:24px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.footer-copy { font-family:var(--font-mono); font-size:.7rem; color:rgba(255,255,255,.2); letter-spacing:.08em; }
.footer-badges { display:flex; gap:6px; align-items:center; }
.fbadge { font-family:var(--font-mono); font-size:.65rem; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.3); border:1px solid rgba(255,255,255,.1); border-radius:4px; padding:4px 8px; transition:all .2s; cursor:default; }
#admin-trigger { font-family:var(--font-mono); font-size:.8rem; color:rgba(255,255,255,.08); background:transparent; border:none; cursor:pointer; padding:6px; transition:color .3s; }
#admin-trigger:hover { color:var(--safety); }

/* ── MODALS ── */
/* ── MODALS ── */
.modal { display:none; position:fixed; inset:0; z-index:2000; /* ¡Aumentado a 2000! */ background:rgba(26,31,60,.65); backdrop-filter:blur(6px); align-items:center; justify-content:center; padding:16px; }
.modal.open { display:flex; }
.modal-panel { background:var(--surface); border-radius:var(--r-xl); width:100%; max-width:440px; overflow:hidden; box-shadow:var(--shadow-lg); animation:modalIn .35s var(--ease-spring); max-height:calc(100vh - 32px); display:flex; flex-direction:column; }
.modal-panel.wide { max-width:620px; }
@keyframes modalIn { from{transform:scale(.93) translateY(16px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;} }
.modal-head { background:linear-gradient(135deg,var(--orbis-deep) 0%,var(--orbis) 100%); padding:20px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--safety); flex-shrink:0; }
.modal-head-title { font-family:var(--font-mono); font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; color:var(--safety); }
.modal-close { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:rgba(255,255,255,.6); width:36px; height:36px; border-radius:var(--r-sm); cursor:pointer; transition:all .15s; font-size:.9rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.modal-close:hover { background:rgba(255,255,255,.2); color:#fff; }
.modal-body { padding:24px; overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; }
.mfield { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.mfield label { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); }
.mfield input, .mfield select, .mfield textarea { background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:var(--font-body); font-size:.9rem; padding:12px; border-radius:var(--r); outline:none; min-height:48px; width:100%; transition:border-color .15s,box-shadow .15s; }
.mfield input:focus, .mfield select:focus, .mfield textarea:focus { border-color:var(--orbis); box-shadow:0 0 0 3px rgba(47,59,162,.08); background:#fff; }
.mfield textarea { min-height:80px; resize:vertical; }
.mfield-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.merror { font-family:var(--font-mono); font-size:.7rem; color:var(--danger); letter-spacing:.08em; display:none; margin-bottom:8px; }
.merror.show { display:block; }
.modal-foot { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-shrink:0; }
.msave-btn { background:var(--orbis); color:#fff; font-weight:700; font-size:.875rem; border:none; border-radius:var(--r); padding:12px 22px; cursor:pointer; transition:all .15s; min-height:48px; }
.msave-btn:hover:not(:disabled) { background:var(--orbis-dark); }
.msave-btn:disabled { opacity:.6; cursor:not-allowed; }
.mcancel-btn { background:transparent; color:var(--text-2); border:1px solid var(--border); font-size:.875rem; border-radius:var(--r); padding:12px 18px; cursor:pointer; transition:all .15s; min-height:48px; }
.mcancel-btn:hover { border-color:var(--text-2); }
.prod-upload-area { border:1.5px dashed var(--border); border-radius:var(--r); padding:20px; text-align:center; cursor:pointer; position:relative; transition:all .2s; background:var(--surface2); }
.prod-upload-area:hover { border-color:var(--orbis); background:var(--orbis-light); }
.prod-upload-area input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.prod-upload-hint { font-family:var(--font-mono); font-size:.75rem; color:var(--text-3); letter-spacing:.08em; }
.prod-preview { width:100%; max-height:120px; object-fit:cover; border-radius:var(--r-sm); margin-bottom:8px; display:none; }

/* ── CHANGE #6: Cart sidebar — inverted button hierarchy ── */
.cart-overlay { 
  display:none; position:fixed; inset:0; 
  z-index:1000; /* ¡Corregido! Ahora está por encima de todo */
  background:rgba(26,31,60,.5); backdrop-filter:blur(4px); 
  touch-action:none; 
}
.cart-overlay.open { display:block; }
.cart-sidebar { 
  position:fixed; top:0; bottom:0; right:-100%; 
  height:100dvh; 
  z-index:1001; /* ¡Corregido! Mayor jerarquía que el menú inferior */
  width:min(420px,100vw); background:var(--surface); 
  display:flex; flex-direction:column; 
  box-shadow:-8px 0 48px rgba(47,59,162,.2); transition:right .4s var(--ease-smooth); 
  overscroll-behavior:contain; 
}
.cart-sidebar.open { right:0; }
.cart-head { background:linear-gradient(135deg,var(--orbis-deep) 0%,var(--orbis) 100%); padding:20px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--safety); flex-shrink:0; }
.cart-title { font-family:var(--font-display); font-size:1.1rem; color:#fff; letter-spacing:.02em; }
.cart-close { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:rgba(255,255,255,.7); width:36px; height:36px; border-radius:50%; cursor:pointer; transition:all .15s; font-size:.9rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.cart-close:hover { background:rgba(255,255,255,.2); color:#fff; }

/* ¡CORRECCIÓN CLAVE PARA EL SCROLL INTERNO! */
.cart-body { 
  flex:1 1 auto; 
  min-height:0; /* Obliga a la caja a respetar los límites de la pantalla */
  overflow-y:auto; 
  padding:16px; 
  -webkit-overflow-scrolling:touch; 
}

.cart-empty { text-align:center; padding:48px 20px; }
.cart-empty-icon { font-size:3rem; margin-bottom:12px; opacity:.4; }
.cart-empty-text { font-size:.9rem; color:var(--text-3); line-height:1.6; }
.cart-item { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
.cart-item:last-child { border-bottom:none; }
.cart-item-img { width:60px; height:60px; border-radius:var(--r); overflow:hidden; flex-shrink:0; background:var(--orbis-light); display:flex; align-items:center; justify-content:center; }
.cart-item-img img { width:100%; height:100%; object-fit:cover; }
.cart-item-info { flex:1; min-width:0; }
.cart-item-name { font-size:.875rem; font-weight:600; color:var(--text); margin-bottom:4px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cart-item-price { font-family:var(--font-display); font-size:1rem; color:var(--orbis); margin-bottom:8px; }
.cart-item-qty { display:flex; align-items:center; gap:8px; }
.qty-btn { width:28px; height:28px; background:var(--orbis-light); border:1px solid var(--orbis-mid); color:var(--orbis); border-radius:var(--r-sm); cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; transition:all .15s; }
.qty-btn:hover:not(:disabled) { background:var(--orbis); color:#fff; }
.qty-btn:disabled { opacity:.4; cursor:not-allowed; }
.qty-val { font-family:var(--font-mono); font-size:.85rem; font-weight:600; color:var(--text); min-width:20px; text-align:center; }
.cart-item-remove { background:transparent; border:none; color:var(--text-3); cursor:pointer; font-size:.9rem; padding:6px; border-radius:var(--r-sm); transition:all .15s; flex-shrink:0; }
.cart-item-remove:hover { background:var(--danger); color:#fff; }

/* FOOTER FIJO */
.cart-foot { 
  flex-shrink:0; 
  padding:16px 16px max(16px, env(safe-area-inset-bottom)); 
  border-top:2px solid var(--border); 
  background:var(--surface); 
  box-shadow:0 -4px 16px rgba(0,0,0,.04); 
  z-index: 10;
}
#cart-foot:not([style*="none"]) { display: flex !important; flex-direction: column; }
.cart-sync-chip { order: -3; }
.cart-subtotal  { order: -2; }
.cart-note      { order: -1; }

.cart-subtotal { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.cart-subtotal-label { font-family:var(--font-mono); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); }
.cart-subtotal-val { font-family:var(--font-display); font-size:1.35rem; color:var(--orbis); }
.cart-note { font-family:var(--font-mono); font-size:.65rem; color:var(--text-3); letter-spacing:.06em; margin-bottom:14px; }

.btn-checkout { width:100%; color:#fff; font-weight:700; font-size:.95rem; border:none; border-radius:var(--r-lg); padding:16px; cursor:pointer; transition:all .3s var(--ease-spring); display:flex; align-items:center; justify-content:center; gap:10px; min-height:52px; }
.btn-checkout.whatsapp { order:1; background:linear-gradient(135deg,#25D366 0%,#1ebe5d 100%); box-shadow:0 4px 16px rgba(37,211,102,.35); margin-bottom:10px; }
.btn-checkout.whatsapp:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(37,211,102,.45); }
.btn-checkout.cotizacion { order:2; background:transparent; color:var(--orbis); border:2px solid var(--orbis); box-shadow:none; margin-bottom:0; font-size:.88rem; }
.btn-checkout.cotizacion:hover { background:var(--orbis-light); }
/* ★ PRIMARY: WhatsApp — solid green, rendered first via order */
.btn-checkout.whatsapp {
  order: 1;
  background: linear-gradient(135deg,#25D366 0%,#1ebe5d 100%);
  box-shadow: 0 4px 16px rgba(37,211,102,.35);
  margin-bottom: 10px;
}
.btn-checkout.whatsapp:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(37,211,102,.45);
}

/* ★ SECONDARY: PDF — outlined, rendered below */
.btn-checkout.cotizacion {
  order: 2;
  background: transparent;
  color: var(--orbis);
  border: 2px solid var(--orbis);
  box-shadow: none;
  margin-bottom: 0;
  font-size: .88rem;
}
.btn-checkout.cotizacion:hover {
  background: var(--orbis-light);
  transform: none;
  box-shadow: none;
}

/* ── SYNC INDICATOR ── */
.cart-sync-chip { font-family:var(--font-mono); font-size:.6rem; letter-spacing:.08em; display:inline-flex; align-items:center; gap:4px; color:var(--text-3); padding:3px 8px; background:var(--surface2); border-radius:100px; border:1px solid var(--border); margin-bottom:10px; }
.cart-sync-chip.synced { color:var(--success); background:#D1FAE5; border-color:rgba(16,185,129,.2); }
.cart-sync-chip.syncing { color:var(--safety-dark); background:#FEF3C7; border-color:rgba(245,158,11,.2); }
.cart-sync-dot { width:5px; height:5px; border-radius:50%; background:currentColor; flex-shrink:0; }
.cart-sync-chip.syncing .cart-sync-dot { animation:pulse .8s infinite; }

/* ── QUICK VIEW ── */
/* ════════════════════════════════════════════════════════
   QUICK VIEW v2.0 — Premium two-column product showcase
════════════════════════════════════════════════════════ */
#quick-view-modal { display: none; position: fixed; inset: 0; z-index: 2000; background: rgba(10, 15, 56, 0.6); backdrop-filter: blur(14px) saturate(180%); -webkit-backdrop-filter: blur(14px) saturate(180%); align-items: center; justify-content: center; padding: 20px; }
#quick-view-modal.open { display: flex; }
.qv-backdrop { position: absolute; inset: 0; cursor: default; }
.qv-panel { position: relative; z-index: 1; background: var(--surface); border-radius: var(--r-xl); width: 100%; max-width: 900px; display: grid; grid-template-columns: 42% 58%; overflow: hidden; box-shadow: 0 40px 100px rgba(21, 30, 107, .32), 0 10px 30px rgba(0, 0, 0, .18), 0 0 0 1px rgba(47, 59, 162, .1); animation: qvIn .42s var(--ease-spring) both; max-height: min(90vh, 660px); }
@keyframes qvIn { from { opacity: 0; transform: scale(.91) translateY(24px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.qv-image-col { position: relative; background: linear-gradient(160deg, var(--orbis-deep) 0%, var(--orbis) 55%, #4B5CC4 100%); overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 440px; }
.qv-image-col::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; z-index: 0; }
.qv-image-col-watermark { position: absolute; bottom: -28px; right: -16px; font-family: var(--font-display); font-size: 11rem; font-weight: 800; color: rgba(255,255,255,.042); line-height: 1; pointer-events: none; user-select: none; letter-spacing: -.06em; z-index: 0; }
.qv-img-stage { position: relative; z-index: 1; width: calc(100% - 48px); aspect-ratio: 1 / 1; background: #ffffff; border-radius: var(--r-lg); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 12px 48px rgba(0, 0, 0, .22), 0 4px 12px rgba(0, 0, 0, .14), inset 0 0 0 1px rgba(0,0,0,.04); transition: transform .5s var(--ease-elegant); }
.qv-panel:hover .qv-img-stage { transform: scale(1.025); }
.qv-img-stage img { width: 100%; height: 100%; object-fit: contain; padding: 20px; transition: transform .6s var(--ease-elegant); }
.qv-img-placeholder-new { font-size: 6rem; opacity: .2; user-select: none; }
.qv-cat-badge { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .22); border-radius: 100px; padding: 8px 16px; backdrop-filter: blur(12px); box-shadow: 0 2px 12px rgba(0,0,0,.12); }
.qv-cat-badge-icon { font-size: .95rem; line-height: 1; }
.qv-cat-badge-name { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.88); font-weight: 600; }
.qv-sku-tag { position: absolute; bottom: 20px; left: 20px; z-index: 10; font-family: var(--font-mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--safety); background: rgba(15, 22, 80, .7); border: 1px solid rgba(245, 158, 11, .28); border-radius: 6px; padding: 5px 12px; backdrop-filter: blur(8px); }
.qv-close-fab { position: absolute; top: 18px; right: 18px; z-index: 20; width: 38px; height: 38px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.24); color: rgba(255,255,255,.8); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .88rem; transition: all .22s var(--ease-spring); backdrop-filter: blur(8px); }
.qv-close-fab:hover { background: rgba(255,255,255,.26); color: #fff; transform: scale(1.1) rotate(90deg); border-color: rgba(255,255,255,.4); }
.qv-details-col { display: flex; flex-direction: column; overflow-y: auto; padding: 32px 30px; gap: 0; position: relative; }
.qv-details-col::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--orbis-deep) 0%, var(--orbis) 25%, var(--safety) 50%, var(--orbis) 75%, var(--orbis-deep) 100%); background-size: 300% 100%; animation: accentShift 5s ease-in-out infinite; }
.qv-breadcrumb { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; color: var(--orbis-mid); margin-bottom: 12px; margin-top: 4px; }
.qv-breadcrumb-sep { opacity: .4; }
.qv-product-name { font-family: var(--font-display); font-size: clamp(1.25rem, 2.4vw, 1.65rem); color: var(--text); line-height: 1.15; letter-spacing: -.025em; margin-bottom: 22px; font-weight: 800; }
.qv-price-block { background: linear-gradient(135deg, var(--orbis-light) 0%, rgba(232,235,250,.45) 100%); border: 1px solid rgba(47,59,162,.1); border-radius: var(--r-lg); padding: 16px 20px; margin-bottom: 16px; position: relative; overflow: hidden; }
.qv-price-block::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, var(--orbis) 0%, var(--orbis-mid) 100%); }
.qv-price-label-small { font-family: var(--font-mono); font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: var(--orbis-mid); margin-bottom: 5px; }
.qv-price-display { display: flex; align-items: baseline; gap: 2px; line-height: 1; margin-bottom: 6px; }
.qv-price-currency { font-family: var(--font-display); font-size: 1.3rem; color: var(--orbis); font-weight: 700; align-self: flex-start; margin-top: 6px; }
.qv-price-number { font-family: var(--font-display); font-size: 2.6rem; font-weight: 800; background: linear-gradient(135deg, var(--orbis) 0%, var(--orbis-dark) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -.04em; line-height: 1; }
.qv-price-unit-label { font-family: var(--font-mono); font-size: .68rem; color: var(--text-3); letter-spacing: .12em; margin-left: 6px; margin-bottom: 4px; }
.qv-iva-note { font-family: var(--font-mono); font-size: .58rem; color: var(--text-3); letter-spacing: .06em; }
.qv-stock-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.qv-stock-pill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: .63rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; border-radius: 100px; padding: 6px 14px; border: 1px solid transparent; }
.qv-stock-pill.in  { color: var(--success); background: #D1FAE5; border-color: rgba(16,185,129,.2); }
.qv-stock-pill.low { color: var(--safety-dark); background: #FEF3C7; border-color: rgba(245,158,11,.2); }
.qv-stock-pill.out { color: var(--danger); background: #FEE2E2; border-color: rgba(239,68,68,.2); }
.qv-stock-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.qv-stock-pill.in .qv-stock-dot,.qv-stock-pill.low .qv-stock-dot { animation: pulse 2s infinite; }
.qv-product-desc { font-size: .875rem; color: var(--text-2); line-height: 1.78; font-weight: 300; margin-bottom: 22px; letter-spacing: .005em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.qv-qty-section { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.qv-qty-label { font-family: var(--font-mono); font-size: .64rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); flex-shrink: 0; }
.qv-qty-controls { display: flex; align-items: stretch; border: 1.5px solid var(--border); border-radius: var(--r); overflow: hidden; background: var(--surface2); transition: border-color .15s; }
.qv-qty-controls:focus-within { border-color: var(--orbis); box-shadow: 0 0 0 3px rgba(47,59,162,.08); }
.qv-qty-dec, .qv-qty-inc { width: 42px; height: 42px; background: transparent; border: none; color: var(--orbis); font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: background .15s var(--ease-elegant), color .15s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; line-height: 1; }
.qv-qty-dec:hover:not(:disabled),.qv-qty-inc:hover:not(:disabled) { background: var(--orbis); color: #fff; }
.qv-qty-dec:disabled,.qv-qty-inc:disabled { opacity: .32; cursor: not-allowed; }
.qv-qty-number { min-width: 46px; text-align: center; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; color: var(--text); border-left: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0 6px; line-height: 42px; height: 42px; background: var(--surface); transition: background .15s; }
.qv-qty-total { font-family: var(--font-display); font-size: 1.05rem; color: var(--orbis); font-weight: 700; letter-spacing: -.01em; white-space: nowrap; margin-left: auto; flex-shrink: 0; }
.qv-actions-stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.btn-qv-add { width: 100%; background: linear-gradient(135deg, var(--orbis) 0%, var(--orbis-dark) 100%); color: #fff; font-family: var(--font-body); font-weight: 800; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; border: none; border-radius: var(--r); padding: 16px 22px; cursor: pointer; transition: all .25s var(--ease-spring); display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; position: relative; overflow: hidden; box-shadow: 0 4px 18px rgba(47,59,162,.3), inset 0 1px 0 rgba(255,255,255,.12); }
.btn-qv-add::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, transparent 55%); pointer-events: none; }
.btn-qv-add:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(47,59,162,.44), inset 0 1px 0 rgba(255,255,255,.12); }
.btn-qv-add:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-qv-add.added { background: linear-gradient(135deg, var(--success) 0%, #059669 100%); box-shadow: 0 4px 18px rgba(16,185,129,.3); }
.btn-qv-whatsapp { width: 100%; background: transparent; color: #1aaa55; border: 2px solid #25D366; font-family: var(--font-body); font-weight: 700; font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; border-radius: var(--r); padding: 13px 22px; cursor: pointer; transition: all .22s var(--ease-spring); display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.btn-qv-whatsapp:hover { background: #25D366; color: #fff; box-shadow: 0 6px 22px rgba(37,211,102,.28); transform: translateY(-1px); }
.qv-trust-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 12px; }
.qv-trust-item { font-family: var(--font-mono); font-size: .58rem; letter-spacing: .07em; color: var(--text-3); display: flex; align-items: center; gap: 4px; }
@media (max-width: 600px) {
  #quick-view-modal { align-items: flex-end; padding: 0; }
  .qv-panel { grid-template-columns: 1fr; max-height: 94dvh; border-radius: var(--r-xl) var(--r-xl) 0 0; margin-bottom: 0; align-self: flex-end; animation: qvSlideUp .42s var(--ease-spring) both; max-width: 100%; }
  @keyframes qvSlideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
  .qv-panel::before { content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; background: rgba(255,255,255,.35); border-radius: 2px; z-index: 30; pointer-events: none; }
  .qv-image-col { min-height: 200px; max-height: 240px; }
  .qv-img-stage { width: calc(100% - 36px); }
  .qv-image-col-watermark { display: none; }
  .qv-details-col { padding: 20px 18px; max-height: 56dvh; overflow-y: auto; }
  .qv-product-name { font-size: 1.3rem; margin-bottom: 16px; }
  .qv-price-number { font-size: 2.1rem; }
  .qv-product-desc { -webkit-line-clamp: 2; font-size: .82rem; }
  .qv-qty-section  { gap: 10px; }
  .qv-qty-total    { font-size: .9rem; }
  .qv-trust-row    { gap: 8px; }
  .qv-trust-item   { font-size: .54rem; }
}
@media (min-width: 601px) and (max-width: 860px) {
  .qv-panel { max-width: 95%; max-height: min(88vh, 580px); grid-template-columns: 38% 62%; }
  .qv-product-name { font-size: 1.4rem; }
  .qv-price-number { font-size: 2.2rem; }
}

/* ── SEARCH ── */

/* ── TOAST ── */
#toast-container { position:fixed; bottom:calc(var(--mobile-nav-h) + 16px + var(--safe-bottom)); left:50%; transform:translateX(-50%); z-index:9000; display:flex; flex-direction:column; gap:8px; pointer-events:none; width:min(340px,calc(100vw - 32px)); }
@media(min-width:769px){#toast-container{bottom:24px;left:auto;right:24px;transform:none;}}
.toast { background:linear-gradient(135deg,var(--orbis-deep) 0%,var(--orbis) 100%); color:#fff; border-radius:var(--r-lg); padding:14px 18px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-xl); border-left:3px solid var(--safety); animation:toastIn .4s var(--ease-spring) forwards; pointer-events:all; }
.toast.out { animation:toastOut .3s ease forwards; }

/* ── RIPPLE ── */

/* ── CHANGE #2: WA FAB — elevated with extra margin vs bottom-nav ── */

/* ── SKELETON ── */

.reveal { opacity:0; transform:translateY(20px); transition:opacity .7s var(--ease-smooth),transform .7s var(--ease-smooth); }

/* ── PTR ── */

════════════════════════════════════════════════ */
@media(max-width:768px) {

  display: flex; flex-direction: column;
  background: var(--surface);
  border-radius: var(--r-xl); /* Bordes bien redondeados */
  width: 100%; max-width: 680px; /* Ancho máximo para PC */
  max-height: 80vh; /* Que no se salga de la pantalla */
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(21, 30, 107, 0.25), 0 0 0 1px rgba(255,255,255,0.1);
  margin: 0;
  animation: searchModalIn 0.3s var(--ease-spring);
}
@keyframes searchModalIn {
  from { opacity: 0; transform: scale(0.96) translateY(-15px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.search-input-wrap {
  display: flex; align-items: center;
  padding: 16px 24px; gap: 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border); /* Raya sutil en vez de la azul gruesa */
  flex-shrink: 0;
}
.search-icon { font-size: 1.3rem; opacity: 0.6; }

#search-input {
  flex: 1; border: none; outline: none; background: transparent;
  font-family: var(--font-body);
  font-size: 1.15rem !important; /* Letra más grande y legible */
  color: var(--text); padding: 4px 0;
}
#search-input::placeholder { color: var(--text-3); font-weight: 400; }

/* Botón cancelar convertido en una pastilla elegante */
.search-cancel {
  background: var(--surface2); color: var(--text-2);
  padding: 6px 14px; border-radius: 100px; font-weight: 600; font-family: var(--font-body);
  transition: all 0.2s; border: none; cursor: pointer;
}
.search-cancel:hover { background: var(--orbis-light); color: var(--orbis); }

#search-results {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 12px 0;
}

/* Mejora visual al pasar el cursor sobre los resultados */
.search-result-item {
  margin: 0 12px; border-radius: 8px; border-bottom: none !important;
}

/* Optimización para celular */
@media (max-width: 768px) {
  .mobile-search-bar { padding: 16px; justify-content: flex-start; }
  .search-panel { max-height: 90vh; }
  #search-input { font-size: 16px !important; } /* Prevenir zoom automático en iPhone */
}

/* ─────────────────────────────────────────────────
   FIX 3 · DRAWER → PANEL LATERAL DESLIZANTE
───────────────────────────────────────────────── */
#drawer-backdrop {  display: none;  position: fixed;  top: calc(var(--toolbar-h) + var(--nav-h));  left: 0; right: 0; bottom: 0;  z-index: 198;  background: rgba(26,31,60,.55);  backdrop-filter: blur(3px);  -webkit-backdrop-filter: blur(3px);}
#drawer-backdrop.open { display: block; }
#mobile-drawer {  display: none;  position: fixed;  top: calc(var(--toolbar-h) + var(--nav-h));  left: 0; bottom: 0;  right: auto !important;  z-index: 199;  width: min(300px, 78vw);  background: var(--surface);  padding: 16px 0 calc(24px + var(--safe-bottom));  flex-direction: column;  gap: 0;  overflow-y: auto;  -webkit-overflow-scrolling: touch;  border-right: 1px solid var(--border);  box-shadow: 6px 0 40px rgba(47,59,162,.2);  transform: translateX(-100%);  visibility: hidden;  transition: transform .35s var(--ease-smooth), visibility 0s .36s;}
@media(max-width:768px) {  #mobile-drawer { display: flex; } }
#mobile-drawer.open {  transform: translateX(0);  visibility: visible;  transition: transform .35s var(--ease-smooth), visibility 0s 0s;}
#mobile-drawer a {  font-size: .975rem;  font-weight: 500;  color: var(--text-2);  padding: 16px 20px;  border-bottom: 1px solid var(--border);  border-radius: 0;  background: transparent;  box-shadow: none;  display: flex;  align-items: center;  gap: 12px;  cursor: pointer;  transition: background .18s, color .18s;}
#mobile-drawer a::after {  content: '›';  font-size: 1.35rem;  font-weight: 300;  color: var(--text-3);  margin-left: auto;  flex-shrink: 0;  transition: transform .2s var(--ease-spring), color .2s;}
#mobile-drawer a:hover,#mobile-drawer a.active {  color: var(--orbis);  background: var(--orbis-light);  box-shadow: none;}
#mobile-drawer a:hover::after,#mobile-drawer a.active::after {  transform: translateX(4px);  color: var(--orbis-mid);}

/* ─────────────────────────────────────────────────
   FIX 4 · CARRITO → TOUCH TARGET 44px + PIE ANCLADO
───────────────────────────────────────────────── */
.cart-item-remove {  background: transparent;  border: none;  color: var(--text-3);  cursor: pointer;  font-size: 1rem;  padding: 0;  border-radius: 50%;  transition: background .15s, color .15s;  flex-shrink: 0;  width: 44px;  height: 44px;  display: flex;  align-items: center;  justify-content: center;}
.cart-item-remove:hover { background: var(--danger); color: #fff; }
.cart-body {  flex: 1;  overflow-y: auto;  padding: 16px;  -webkit-overflow-scrolling: touch;  min-height: 0;}

/* ─────────────────────────────────────────────────
   FIX 2 + FIX 5 · MÓVIL: FAB OCULTO + HERO COMPACTO
───────────────────────────────────────────────── */
@media(max-width:768px) {
  #wa-fab { display: none !important; }
  #cat-hero                { min-height: 0 !important; }
  #cat-hero .hero-inner    { padding: 20px 16px 28px !important; }
  #cat-hero .hero-title    { font-size: 1.5rem !important; margin-bottom: 8px !important; line-height: 1.15; }
  #cat-hero .hero-desc     { font-size: .82rem !important; line-height: 1.5 !important; margin-bottom: 12px !important; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #cat-hero .hero-stats    { display: none !important; }
  #cat-hero .hero-actions  { margin-bottom: 0 !important; gap: 8px !important; }
  #cat-hero .hero-badge    { margin-bottom: 10px !important; }
#cat-hero .hero-diag       { height: 16px !important; }
}

/* ── CATÁLOGO POPUP (MENÚ TIPO BAGUETTE) ── */
#catalog-popup-backdrop { display: none; position: fixed; inset: 0; z-index: 798; }
#catalog-popup-backdrop.open { display: block; }
#catalog-popup {
  position: fixed;
  bottom: calc(var(--mobile-nav-h) + var(--safe-bottom) + 12px);
  left: 16px; right: 16px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-radius: var(--r-xl);
  padding: 16px;
  box-shadow: 0 12px 40px rgba(47,59,162,.15), 0 4px 12px rgba(0,0,0,.08);
  z-index: 799;
  transform: translateY(120%);
  opacity: 0;
  visibility: hidden;
  transition: transform 0.35s var(--ease-spring), opacity 0.3s, visibility 0s 0.35s;
  border: 1px solid rgba(221,227,240,.8);
}
#catalog-popup.open {
  transform: translateY(0);
  opacity: 1;
  visibility: visible;
  transition: transform 0.35s var(--ease-spring), opacity 0.3s, visibility 0s 0s;
}
.cp-title {
  font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 12px;
  text-align: center;
}
.cp-grid { display: flex; flex-direction: column; gap: 6px; }
.cp-grid a {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--surface2);
  border-radius: var(--r); color: var(--text-2);
  font-weight: 500; font-size: 0.95rem;
  transition: background 0.2s, color 0.2s;
  cursor: pointer; border: none; box-shadow: none;
}
.cp-grid a:active { transform: scale(0.98); }
.cp-grid a:hover { background: var(--orbis-light); color: var(--orbis); }

/* ── GALERÍA TIPO MOSTRADOR (CARRUSEL) ── */
/* ── GALERÍA TIPO MOSTRADOR (CARRUSEL AUTOMÁTICO) ── */
.sc-img-wrap.is-gallery {
  aspect-ratio: 1 / 1;
  background: #ffffff;
}
.sc-gallery {
  display: flex;
  width: 100%;
  height: 100%;
  overflow: hidden; /* ← FIX: Evita que el contenedor atrape la rueda del ratón */
  pointer-events: none; /* ← FIX: Obliga al navegador a hacer scroll en la página principal */
}
.sc-gallery::-webkit-scrollbar { display: none; }
.sc-gallery-item {
  flex: 0 0 100%;
  min-width: 100%;
  height: 100%;
  scroll-snap-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sc-gallery-item img { 
  width: 100%; 
  height: 100%; 
  object-fit: contain !important; 
  padding: 20px;
}
/* ─────────────────────────────────────────────────
   FIX 6 · MOSTRADOR MÓVIL A 2 COLUMNAS (TARJETAS CHIQUITAS)
───────────────────────────────────────────────── */
@media (max-width: 768px) {
  /* Forzar 2 columnas en lugar de 1 para vista compacta */
  .showroom-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 12px !important;
  }
  
  /* Reducir espacios y fuentes de la cabecera */
  .sc-cat-header { padding: 8px 10px !important; }
  .sc-cat-icon { font-size: 1.1rem !important; }
  .sc-cat-name { font-size: 0.65rem !important; letter-spacing: 0.08em !important; }
  .sc-cat-arrow { display: none !important; } /* Ocultar flecha para ahorrar espacio */
  
  /* Ajustar recuadro para que sea 100% cuadrado y la imagen se adapte sin recortarse */
  .sc-img-wrap.is-gallery { aspect-ratio: 1 / 1 !important; }
  .sc-gallery-item img { 
    padding: 10px !important; /* Menos margen interior en celular */
    object-fit: contain !important; /* Evita cualquier recorte */
  }
  
  /* Achicar los textos y márgenes generados por Javascript */
  .sc-body { padding: 12px 8px !important; }
  .sc-name { font-size: 0.85rem !important; margin-bottom: 4px !important; line-height: 1.2 !important; }
  .sc-desc { font-size: 0.65rem !important; line-height: 1.3 !important; margin-bottom: 0 !important; }
  
  /* Hacer la etiqueta flotante azul más chiquita */
  .sc-img-badge { font-size: 0.5rem !important; padding: 4px 6px !important; }
}
/* ─────────────────────────────────────────────────
   FIX 7 · CATÁLOGOS INTERNOS A 2 COLUMNAS (NO GIGANTES)
───────────────────────────────────────────────── */
@media (max-width: 768px) {
  /* 1. Cuadrícula de 2 columnas para la lista general de productos */
  .cat-products-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 10px !important;
  }
  
  /* 2. Tarjetas de producto individuales más compactas */
  .prod-card-body { padding: 10px 8px !important; }
  .prod-card-name { font-size: 0.78rem !important; margin-bottom: 4px !important; line-height: 1.25 !important; }
  .prod-card-desc { display: none !important; } /* Ocultamos la descripción larga en móvil para limpiar la vista */
  .prod-card-price { font-size: 1rem !important; margin-bottom: 6px !important; }
  .prod-card-stock { font-size: 0.55rem !important; padding: 3px 6px !important; margin-bottom: 8px !important; }
  .btn-add-card { font-size: 0.7rem !important; min-height: 32px !important; padding: 6px !important; }
  
  /* 3. Imágenes de los productos completas (sin recortes) con fondo blanco */
  .prod-card-img { aspect-ratio: 1 / 1 !important; background: #ffffff !important; }
  .prod-card-img img { 
    object-fit: contain !important; 
    padding: 12px !important; 
  }
  
  /* 4. Arreglar el producto DESTACADO (Portada) para que no sea un bloque vertical gigante */
  .cat-cover-body { 
    grid-template-columns: 120px 1fr !important; /* Diseño horizontal en celular */
    min-height: auto !important; 
  }
  .cat-product-img-wrap { aspect-ratio: 1 / 1 !important; background: #ffffff !important; }
  .cat-product-img-wrap img { object-fit: contain !important; padding: 12px !important; }
  .cat-cover-info { padding: 12px !important; gap: 6px !important; justify-content: center !important; }
  .cat-product-name { font-size: 0.95rem !important; margin-bottom: 2px !important; line-height: 1.2 !important; }
  .cat-product-desc { display: none !important; } 
  .cat-product-price { font-size: 1.1rem !important; }
  .btn-cover-explore { font-size: 0.75rem !important; min-height: 34px !important; padding: 6px 12px !important; margin-top: 4px !important;}
}
/* ─────────────────────────────────────────────────
   FIX 8 · PERFIL EN TOP NAV Y BOTTOM NAV LIMPIO
───────────────────────────────────────────────── */
.mobile-profile-icon { display: none !important; }

@media (max-width: 768px) {
  /* Mostrar el botón de perfil arriba solo en móvil */
  .mobile-profile-icon { display: flex !important; }
  
  /* Resucita los íconos de la barra superior */
  .btn-cart span:first-child { 
    display: inline-block !important; 
    font-size: 1.25rem;
  }
/* Achica los botones top para que sean cuadros perfectos */
  .btn-cart, .mobile-profile-icon { 
    padding: 8px !important; 
    min-width: 42px; 
    height: 42px;
    justify-content: center;
    overflow: visible !important; /* ¡MAGIA! Deja que el globito salga del borde */
  }
  
  /* Aseguramos que la animación de fondo no se salga de las curvas */
  .btn-cart::before { 
    border-radius: inherit !important; 
  }
  
  /* Empujamos el globito a la esquina perfecta */
  .cart-badge {
    top: -5px !important;
    right: -5px !important;
  }
  
  /* Ajusta los 5 botones inferiores para que respiren mejor */
.mbn-label { font-size: 0.55rem !important; letter-spacing: 0; }
  .mbn-icon { font-size: 1.25rem !important; }
}
/* ─────────────────────────────────────────────────
   FIX 9 · AJUSTAR TARJETAS DE ESTADÍSTICAS EN MÓVIL
───────────────────────────────────────────────── */
@media (max-width: 768px) {
  .hero-stats {
    gap: 8px !important; /* Reduce el hueco entre las tarjetas */
    width: 100%; /* Evita que el contenedor rebase la pantalla */
  }
  .hero-stat {
    flex: 1; /* Obliga a las 3 tarjetas a dividirse el 100% del ancho por igual */
    min-width: 0; /* Permite que se compriman sin romperse */
    padding: 12px 4px !important; /* Relleno lateral más delgado en celular */
    align-items: center; /* Centra el contenido */
    text-align: center;
  }
  .hero-stat-num {
    font-size: 1.25rem !important; /* Achica un poco el número */
  }
  .hero-stat-label {
    font-size: 0.5rem !important; 
    letter-spacing: 0.05em !important;
  }
}

/* ── BOTONES DE PAGINACIÓN NUMÉRICA ── */

.qv-panel {

.qv-details-col {
